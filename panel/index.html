<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>女装小红书工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23e0303f%22/%3E%3C/svg%3E">
<style>
/* 女装小红书工作台 v5
   布局：左侧导航（四大块按流程 1→2→3→4，当前块展开子页）+ 右侧页面（页头一句话说明 → 内容 → 底部固定的主按钮）。
   视觉：暖白底、卡片轻阴影少描边；小红书红只给主按钮和选中态；8px 间距；一页只有一个红色主按钮。 */
:root{
  --paper:#f6f4f2; --card:#ffffff; --ink:#1d1a19; --ink2:#4a4442; --muted:#857c79; --line:#ebe5e2; --soft:#f3efed; --soft2:#faf8f7;
  --accent:#e0303f; --accent-ink:#ffffff; --accent-soft:#fdecee; --accent-line:#f6c5ca;
  --good:#1f7a4d; --good-soft:#e7f4ec; --warn:#9a5f0b; --warn-soft:#fbf1df; --bad:#c0362c; --bad-soft:#fcebe9; --info:#2a5fb0; --info-soft:#e9f0fb;
  --shadow:0 1px 2px rgba(29,26,25,.05),0 2px 8px rgba(29,26,25,.04); --shadow-up:0 -6px 16px rgba(29,26,25,.05);
  --r:10px; --r2:14px;
  --body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141213; --card:#1d1a1b; --ink:#f3eeec; --ink2:#cfc7c4; --muted:#9a908d; --line:#2f2a2b; --soft:#262122; --soft2:#201c1d;
  --accent:#f25a66; --accent-ink:#1a0b0d; --accent-soft:#3a1d21; --accent-line:#6b2c33;
  --good:#5cc08a; --good-soft:#1c3328; --warn:#e3a54a; --warn-soft:#3a2d17; --bad:#f07a70; --bad-soft:#3d1f1c; --info:#7fa8ea; --info-soft:#1d2a40;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-up:0 -6px 16px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141213; --card:#1d1a1b; --ink:#f3eeec; --ink2:#cfc7c4; --muted:#9a908d; --line:#2f2a2b; --soft:#262122; --soft2:#201c1d;
  --accent:#f25a66; --accent-ink:#1a0b0d; --accent-soft:#3a1d21; --accent-line:#6b2c33;
  --good:#5cc08a; --good-soft:#1c3328; --warn:#e3a54a; --warn-soft:#3a2d17; --bad:#f07a70; --bad-soft:#3d1f1c; --info:#7fa8ea; --info-soft:#1d2a40;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-up:0 -6px 16px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;line-height:1.35;font-weight:600;text-wrap:balance}
h1{font-size:22px;letter-spacing:-.01em}h2{font-size:16px}h3{font-size:14px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:12.5px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:16px}
select,input,textarea,button{font:inherit;color:inherit}
select,input,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0;transition:border-color .15s}
select:hover,input:hover,textarea:hover{border-color:#d9d0cc}
textarea{resize:vertical;line-height:1.7}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
button:hover{border-color:#d5ccc8;background:var(--soft2)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.primary:hover{filter:brightness(.95);background:var(--accent)}
button.big{padding:10px 22px;font-size:15px;border-radius:10px}
button.ghost{background:transparent;border-color:transparent}
button.ghost:hover{background:var(--soft)}
button.danger{color:var(--bad)}
button.link{border:0;background:none;color:var(--accent);padding:0;font-weight:500}
button.link:hover{text-decoration:underline;background:none}
button:disabled{opacity:.4;cursor:not-allowed}
a{color:var(--accent)}

/* ---------- 外框：左侧导航 + 右侧页面 */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--card);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand .mk{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.brand b{font-size:15px}
.brand span{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.accsw{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:var(--r);background:var(--soft2);border:1px solid var(--line)}
.accsw select{border:0;background:transparent;padding:2px 0;font-weight:600}
.accsw select:focus{box-shadow:none}
.login{display:flex;align-items:center;gap:6px;border:0;background:none;padding:0;font-size:12.5px;color:var(--muted)}
.login:hover{background:none;color:var(--ink)}
.login i{width:7px;height:7px;border-radius:50%;background:var(--bad)}
.login.on i{background:var(--good)}
nav.secs{display:flex;flex-direction:column;gap:2px;position:relative}
.sec-b{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:8px 8px;border-radius:9px;color:var(--ink2)}
.sec-b:hover{background:var(--soft)}
.sec-b .n{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--muted);background:var(--card);position:relative;z-index:1}
.sec-b b{font-weight:600;font-size:14.5px}
.sec-b .c{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.sec-b[aria-selected="true"]{color:var(--ink);background:var(--soft)}
.sec-b[aria-selected="true"] .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sec-b .c.hot{color:var(--accent);font-weight:600}
nav.secs::before{content:"";position:absolute;left:20px;top:22px;bottom:22px;width:1.5px;background:var(--line)}
.subs{display:flex;flex-direction:column;gap:1px;margin:2px 0 8px 44px;position:relative;z-index:1}
.subs button{border:0;background:none;text-align:left;padding:5px 10px;border-radius:7px;color:var(--muted);font-size:13.5px;display:flex;justify-content:space-between;gap:6px}
.subs button:hover{background:var(--soft);color:var(--ink)}
.subs button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft);font-weight:600}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.ai{display:flex;gap:8px;align-items:center;width:100%;border-radius:9px;padding:8px 10px;background:var(--soft2);font-size:12.5px;border:1px solid var(--line);white-space:normal;text-align:left}
.dot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--accent);animation:p 1.4s infinite;display:inline-block}
@keyframes p{50%{opacity:.25}}
.main{min-width:0;padding:24px 32px 64px}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px}
.crumb{font-size:12px;color:var(--muted);margin-bottom:2px}
.pdesc{margin:4px 0 0;color:var(--muted);font-size:13.5px;max-width:640px}
nav.subm{display:none}

/* ---------- 通用块 */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:20px 22px 0;min-width:0;box-shadow:var(--shadow)}
.panel > .stack{padding-bottom:20px}
.panel.pad{padding-bottom:20px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--soft);color:var(--muted);white-space:nowrap;line-height:1.7}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.acc{background:var(--info-soft);color:var(--info)}
.notice{border-radius:var(--r);padding:10px 14px;background:var(--soft);font-size:13px;color:var(--ink2);border:1px solid var(--line)}
.notice b{color:var(--ink)}
.notice.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.notice.demo{background:var(--info-soft);border-color:transparent;color:var(--info)}
.hint{font-size:13px;color:var(--ink2);background:var(--soft2);border:1px solid var(--line);border-radius:var(--r);padding:9px 12px;line-height:1.7}
.hint.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.hint.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.hint.good{background:var(--good-soft);border-color:transparent;color:var(--good)}
.empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:13.5px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty::before{content:"";width:44px;height:44px;border-radius:12px;background:var(--soft);border:1.5px dashed var(--line)}
.ph{border-radius:8px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:11.5px;color:var(--muted);padding:4px;text-align:center}
.th{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;background:var(--soft);display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:999px;padding:6px 14px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
label.f,.field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);min-width:0;font-weight:500}
label.f input,label.f textarea,label.f select{color:var(--ink);font-weight:400;font-size:14px}
::placeholder{color:#b9afab}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 14px}
.wide{grid-column:1/-1}
.sec{display:flex;flex-direction:column;gap:10px}
.sec > .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.sec + .sec{padding-top:16px;border-top:1px solid var(--line)}
/* 每页底部的主按钮：固定在可视区底部，位置永远一样 */
.actions{position:sticky;bottom:0;z-index:3;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--card);margin:4px -22px 0;padding:14px 22px;border-top:1px solid var(--line);border-radius:0 0 var(--r2) var(--r2)}
.actions .row{gap:8px}

/* 两栏：左边列表 + 右边内容 */
.two{display:grid;grid-template-columns:248px minmax(0,1fr);gap:20px;align-items:start}
.left{display:flex;flex-direction:column;gap:6px;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto;padding:2px}
.left .lh{font-size:12px;color:var(--muted);padding:0 4px 2px;display:flex;justify-content:space-between;align-items:center}
.left .it,.left .q{display:block;width:100%;text-align:left;white-space:normal;border-radius:var(--r);padding:10px 12px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.left .it{display:grid;grid-template-columns:42px minmax(0,1fr);gap:10px;align-items:center;padding:8px}
.left .it .th,.left .it .ph{width:42px;height:56px;border-radius:6px}
.left .it b,.left .q b{font-weight:600;font-size:13.5px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin-bottom:4px}
.left [aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.left .add{border:1.5px dashed var(--line);background:transparent;padding:10px;border-radius:var(--r);color:var(--muted);font-weight:500}
.left .add:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.ihead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid var(--line)}

/* 产品图 */
.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.slot{display:flex;flex-direction:column;gap:6px;min-width:0}
.slot .drop{position:relative;aspect-ratio:3/4;border-radius:var(--r);border:1.5px dashed #d9d0cc;background:var(--soft2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12.5px;cursor:pointer;overflow:hidden;padding:0;width:100%}
.slot .drop:hover,.slot .drop.over{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.slot .drop img{width:100%;height:100%;object-fit:cover}
.slot .cap{font-size:12px;color:var(--ink2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.checks{display:flex;flex-direction:column;gap:6px}
.chk{display:grid;grid-template-columns:auto 76px minmax(0,1fr) auto;gap:8px;align-items:center}
.chk input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
.chk select{padding:6px;font-size:12.5px}
.chk .sp{width:16px}
.chk.unsure input:not([type=checkbox]){border-color:#e8c58a;background:var(--warn-soft)}
.intake{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.intake .slot .drop{aspect-ratio:4/5;flex-direction:column;text-align:center;padding:10px;gap:4px}
.stylepick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stylepick button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;white-space:normal;padding:12px 14px;border-radius:var(--r)}
.stylepick button b{font-size:14.5px}
.stylepick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent) inset}
.opt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opt.two-col{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt label{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer;color:var(--ink);font-size:13.5px;font-weight:400}
.opt label:hover{border-color:#d5ccc8}
.opt label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent) inset}
.opt input{width:auto;margin-top:4px;accent-color:var(--accent)}
input[type=checkbox],input[type=radio]{accent-color:var(--accent)}
.models{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.model{text-align:left;white-space:normal;display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:var(--r)}
.model[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent) inset}
.faces{display:flex;gap:4px;flex-wrap:wrap}
.faces img,.faces .ph{width:34px;height:34px;border-radius:50%;object-fit:cover;font-size:10px}
.faces .ph.miss{border:1px dashed var(--bad);color:var(--bad);background:transparent}
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.ref{padding:0;border:0;border-radius:var(--r);background:none;position:relative;display:flex;flex-direction:column;gap:4px;white-space:normal;min-width:0;text-align:left}
.ref:hover{background:none}
.ref .th{outline:1px solid var(--line);outline-offset:-1px;transition:outline-color .15s}
.ref:hover .th{outline-color:#cfc5c1}
.ref[aria-pressed="true"] .th{outline:3px solid var(--accent);outline-offset:-3px}
.ref .n{position:absolute;top:6px;right:6px;background:var(--accent);color:var(--accent-ink);min-width:22px;height:22px;border-radius:11px;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 6px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.ref span.l{font-size:11.5px;color:var(--muted);padding:0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ref .g{position:absolute;left:6px;top:6px}
.refbox .x{position:absolute;top:6px;right:6px;width:24px;height:24px;padding:0;border-radius:50%;background:rgba(255,255,255,.92);border:0;opacity:0;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.refbox:hover .x,.refbox .x:focus-visible{opacity:1}
.refbox select{font-size:11.5px;padding:3px 6px}

/* 文案 */
.titles{display:flex;flex-direction:column;gap:6px}
.titles label{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer;color:var(--ink);font-size:14.5px;font-weight:500}
.titles label:hover{border-color:#d5ccc8}
.titles label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent) inset}
.titles input[type=radio]{width:auto;accent-color:var(--accent)}
.grid{border-collapse:separate;border-spacing:4px;font-size:12.5px;margin:-4px}
.grid th{font-weight:500;color:var(--muted);text-align:center;padding:2px 6px;white-space:nowrap}
.grid th:first-child{text-align:right}
.grid td{text-align:center;padding:7px 4px;min-width:64px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-family:var(--mono)}
.grid td.n2{background:#f9d3d7}.grid td.n3{background:var(--accent);color:var(--accent-ink)}
.grid td.zero{background:transparent;border:1px dashed var(--line);color:#c4bab6;font-weight:400;font-family:var(--body)}
.tlist{display:flex;flex-direction:column}
.trow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 4px;border-top:1px solid var(--line)}
.trow:first-child{border-top:0}
.trow .tx{min-width:0;overflow-wrap:anywhere;font-weight:500}
.trow .meta{font-size:12px;color:var(--muted);font-weight:400}
.trow .acts{display:flex;gap:4px;opacity:.85}
.trow:hover{background:var(--soft2)}
.trow.used .tx{color:var(--muted);font-weight:400}
.addline{display:grid;grid-template-columns:minmax(0,1fr) 100px 100px auto;gap:8px}

/* 发布 */
.imgs{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 6px}
.img{flex:none;width:132px;position:relative;border-radius:var(--r);overflow:hidden}
.img .th{border-radius:var(--r)}
.img .cv{position:absolute;top:6px;left:6px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:600;border-radius:5px;padding:1px 6px}
.img .gr{position:absolute;top:6px;right:6px}
.img .ops{position:absolute;left:0;right:0;bottom:0;display:flex;gap:4px;justify-content:center;flex-wrap:wrap;padding:24px 6px 8px;background:linear-gradient(transparent,rgba(0,0,0,.55));opacity:0;transition:opacity .15s}
.img:hover .ops,.img:focus-within .ops{opacity:1}
.img .ops button{padding:2px 8px;font-size:12px;border:0;background:rgba(255,255,255,.94);color:#1d1a19;border-radius:6px}
.img .ops button.danger{color:var(--bad)}
@media (hover:none){.img .ops{opacity:1}}
.when{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-height:150px;min-width:0;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.day.today{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.day h3{font-size:12px;font-weight:500;color:var(--muted)}
.day h3 b{display:block;font-size:18px;color:var(--ink);font-family:var(--mono);font-weight:600}
.day.today h3,.day.today h3 b{color:var(--accent)}
.cal{display:block;width:100%;text-align:left;white-space:normal;padding:6px 8px;font-size:12.5px;background:var(--warn-soft);border:0;border-left:3px solid var(--warn);border-radius:6px}
.cal .t{font-family:var(--mono);font-size:11.5px;color:var(--muted);display:block}
.cal.done{background:var(--good-soft);border-left-color:var(--good)}.cal.failed,.cal.missed{background:var(--bad-soft);border-left-color:var(--bad)}.cal.running{background:var(--info-soft);border-left-color:var(--info)}
.list{display:flex;flex-direction:column}
.item{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:14px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .main{flex:1 1 260px;min-width:0;padding:0}
.title{font-weight:600;overflow-wrap:anywhere}

/* 历史 */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:14px 16px;display:flex;flex-direction:column;gap:4px;text-align:left;white-space:normal;box-shadow:var(--shadow)}
button.stat:hover{border-color:#d5ccc8;background:var(--card)}
.stat b{font-size:28px;font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;line-height:1.1}
.stat.bad{border-color:var(--accent-line);background:var(--accent-soft)}
.stat.bad b{color:var(--accent)}
table.hist{width:100%;border-collapse:collapse;font-size:13px}
table.mx{width:100%;border-collapse:separate;border-spacing:4px;font-size:12px;table-layout:fixed;min-width:760px}
table.mx th{font-weight:500;color:var(--muted);text-align:left;padding:2px 4px}table.mx th.today{color:var(--accent)}
table.mx td{vertical-align:top;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px;height:56px}
table.mx td.acc{background:none;border:0;padding:4px 6px 4px 0}
table.mx .cal{font-size:11.5px;padding:4px 6px;margin-bottom:3px}.cal.clash{outline:2px solid var(--bad);outline-offset:-1px}
table.hist th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:10px 8px;border-bottom:1px solid var(--line)}
table.hist td{padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.hist tr:last-child td{border-bottom:0}
table.hist tr:hover td{background:var(--soft2)}
table.hist td.t{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}

dialog{border:0;border-radius:16px;background:var(--card);color:var(--ink);padding:24px;width:min(640px,calc(100vw - 32px));max-height:calc(100vh - 40px);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(29,26,25,.4);backdrop-filter:blur(2px)}
pre.log{background:var(--soft2);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:12px;font-family:var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;max-height:55vh;overflow:auto;margin:0}
details summary{cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:13px;z-index:20;max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}

@media (max-width:1100px){
  .app{grid-template-columns:200px minmax(0,1fr)}
  .main{padding:20px}
  .two{grid-template-columns:210px minmax(0,1fr)}
  .slots{grid-template-columns:repeat(3,minmax(0,1fr))}
  .opt{grid-template-columns:1fr}
}
@media (max-width:760px){
  .app{display:block}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px;border-right:0;border-bottom:1px solid var(--line)}
  .brand span{display:none}
  .accsw{flex-direction:row;align-items:center;padding:4px 10px;margin-left:auto}
  nav.secs{flex-direction:row;overflow-x:auto;width:100%;gap:6px}
  nav.secs::before,.subs{display:none}
  .sec-b{grid-template-columns:22px auto;flex:none;width:auto;padding:6px 10px;border:1px solid var(--line)}
  .sec-b .n{width:22px;height:22px;font-size:11px}
  .sec-b .c{display:none}
  .side-foot{margin:0;flex-direction:row;width:100%}
  nav.subm{display:flex;gap:6px;overflow-x:auto;margin:0 0 14px}
  nav.subm button{flex:none;border-radius:999px;padding:5px 12px;font-size:13px;display:flex;gap:4px}
  .day{min-height:84px}
  nav.subm button[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .main{padding:16px}
  .two{grid-template-columns:1fr}
  .left{position:static;max-height:none;flex-direction:row;overflow-x:auto}
  .left .it,.left .q,.left .add{min-width:200px}
  .left .lh{display:none}
  .panel{padding:16px 16px 0}
  .actions{margin:4px -16px 0;padding:12px 16px}
  .slots{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stylepick,.opt.two-col{grid-template-columns:1fr}
  .week{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .chk{grid-template-columns:auto minmax(0,1fr) auto}.chk select{display:none}
  .addline{grid-template-columns:1fr 1fr}
  .addline input{grid-column:1/-1}
  table.hist .hide-s{display:none}
  .pagehead{flex-direction:column;align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.dot{animation:none}}

.panel > .stack:has(> .actions:last-child){padding-bottom:0}

<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="mk" aria-hidden="true">红</div><div><b>女装工作台</b><span>产品图 → 文案 → 发布</span></div></div>
    <div class="accsw"><select id="acc" aria-label="账号"></select><button type="button" class="login" id="online" data-go="login"></button></div>
    <nav class="secs" id="big" aria-label="四大板块"></nav>
    <div class="side-foot">
      <button class="ai" id="aiBtn" type="button"></button>
      <button class="ghost" id="btnSettings" type="button" style="text-align:left">设置</button>
    </div>
  </aside>
  <section class="main">
    <div class="pagehead"><div><div class="crumb" id="crumb"></div><h1 id="ptitle"></h1><p class="pdesc" id="pdesc"></p></div></div>
    <nav class="subm" id="subm" aria-label="子页"></nav>
    <div id="health"></div>
    <main id="page"></main>
  </section>
</div>
<dialog id="dlg"><form method="dialog" id="dlgForm" class="stack"></form></dialog>
<div class="toast" id="toast" hidden></div>
<input type="file" id="photoFile" accept="image/*" hidden>
<input type="file" id="refFile" accept="image/*" multiple hidden>
<input type="file" id="realFile" accept="image/*" multiple hidden>
<input type="file" id="logoFile" accept="image/png,image/*" hidden>

<script>
(() => {
'use strict';
let D = null, sig = '';
const UI = {tab: 'img', sub: {img: 'info', copy: 'review', pub: 'queue', hist: 'all'}, acc: '', item: '', review: '', pubSel: '', week: 0, when: '', whenAt: ''};
// 出图时的选择；写文案时的选择（从「出好的图」或「选题库」带过来）
const PICK = {refs: [], face: 'model', model: '', style: 'mirror', autoWrite: true, split: 1, init: ''};
const W = {item: '', imgs: [], topic: null, split: 1, cover: '', trialItem: ''};
try { const s = JSON.parse(localStorage.getItem('xhs-studio-ui5') || '{}'); Object.assign(UI, s, {sub: Object.assign(UI.sub, s.sub || {})}); } catch (e) {}
const save = () => { try { localStorage.setItem('xhs-studio-ui5', JSON.stringify({tab: UI.tab, sub: UI.sub, acc: UI.acc, item: UI.item})); } catch (e) {} };
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const len = s => Array.from(String(s || '')).length;
const img = p => '/img?p=' + encodeURIComponent(p);
const base = p => String(p || '').split('/').pop();
const stem = p => base(p).replace(/\.[^.]+$/, '');
const pad = n => String(n).padStart(2, '0');
const fmtDT = ms => { const d = new Date(ms); return `${d.getMonth() + 1}月${d.getDate()}日 ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fmtD = ms => { const d = new Date(ms); return `${d.getMonth() + 1}月${d.getDate()}日`; };
function toast(m) { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 3600); }

async function api(path, body, quiet) {
  try {
    const r = await fetch(path, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {})});
    const j = await r.json();
    if (!r.ok || j.ok === false) { if (!quiet) toast(j.error || '操作失败'); return quiet ? j : null; }
    await refresh(true);
    return j;
  } catch (e) { toast('连不上工作台服务，确认它还在运行'); return null; }
}
async function refresh(force) {
  try {
    const r = await fetch('/api/state'); const j = await r.json();
    if (!r.ok || j.ok === false) throw new Error(j.error || '数据读取失败');
    const s = JSON.stringify(j, (k, v) => k === 'now' ? undefined : v);
    if (!force && s === sig) return;
    sig = s; D = j;
    if (!UI.acc || !D.accounts.some(a => String(a.id) === String(UI.acc))) UI.acc = D.accounts.length ? String(D.accounts[0].id) : '';
    render();
  } catch (e) { $('#health').innerHTML = '<div class="notice bad"><b>连不上工作台服务。</b>在 Codex 里说“打开工作台”重新启动。</div>'; }
}

// ---------- helpers
const F = () => D.fashion;
const mine = arr => arr.filter(x => String(x.account_id ?? x.account) === String(UI.acc));
const myItems = () => D.items.filter(i => i.lockName && (!i.account || String(i.account) === String(UI.acc)));
const acc = () => D.accounts.find(a => String(a.id) === String(UI.acc));
const itemName = id => (D.items.find(i => i.id === id) || {}).name || '';
function checkDraft(d, needImg = true) {
  const errs = [], warns = [], t = String(d.title || '').trim(), b = String(d.body || ''), all = t + b + String(d.comment || '');
  if (!t) errs.push('缺标题'); else if (len(t) > 18) errs.push(`标题 ${len(t)} 字，超过 18`);
  if (!b.trim()) errs.push('缺正文'); else if (len(b) > 888) errs.push(`正文 ${len(b)} 字，超过 888`);
  const banned = F().riskErrors.concat(String((acc() || {}).banned || '').split(/[、,，\s]+/).filter(Boolean));
  const e1 = banned.filter(w => all.includes(w)); if (e1.length) errs.push('违规词：' + e1.join('、'));
  const w1 = F().riskWarns.filter(w => all.includes(w)); if (w1.length) warns.push('慎用：' + w1.join('、'));
  if (/^\s{0,3}#{1,6}\s|\*\*[^*]+\*\*|`/m.test(b)) errs.push('有 Markdown 符号');
  if (/^\s{0,3}(?:[-*>]\s)/m.test(b)) warns.push('有列表符号，小红书不识别');
  const n = (d.tags || []).length; if (n < 5 || n > 10) warns.push(`话题 ${n} 个，建议 8–10`);
  if (!/\d{3}\s*(cm|CM)?.{0,6}\d{2,3}\s*(kg|斤)|穿\s*[SMLX]{1,3}\b|[SMLX]{1,3}\s*码/.test(b)) warns.push('没写模特尺码');
  if (needImg && !(d.images || []).length) errs.push('没有图片');
  return {errs, warns, ok: !errs.length};
}
function draftState(r) {
  if (r.status === '已发布') return 'published';
  if (D.schedule.some(s => String(s.review) === String(r.id) && (s.status === 'pending' || s.status === 'running'))) return 'sched';
  if (r.status === '驳回') return 'rejected';
  if (D.ready[String(r.id)]) return 'ready';
  return 'todo';
}
const DSTATE = {todo: ['待审', 'warn'], ready: ['定稿待排期', 'good'], sched: ['已排期', 'acc'], rejected: ['已驳回', 'bad'], published: ['已发布', 'good']};
const activeJobs = () => D.jobs.filter(j => j.status === 'running' || j.status === 'queued');
const JOBST = {queued: ['排队中', ''], running: ['进行中', 'acc'], done: ['完成', 'good'], failed: ['失败', 'bad'], cancelled: ['已取消', '']};
const JOBKIND = {spec: '写档案', lock: '出图', write: '写文案', rewrite: '改稿', topics: '出选题', trial: '试写'};
const allGrades = () => Object.assign({}, ...D.items.map(i => i.grades || {}));
const gradePill = g => g && g.grade ? `<span class="pill ${g.grade === 'A' ? 'good' : g.grade === 'B' ? 'warn' : 'bad'}">${g.grade}</span>` : '';
const myTopics = () => mine(D.topics);
const unusedTopics = () => myTopics().filter(t => t.status === 'unused');
const refStyle = r => D.lock.refStyles[r] || 'other';
// 这款能配文案的图：AI 出的 + 自己拍的实拍图 + 面料近拍
const isReal = (it, p) => (it.realPhotos || []).includes(p) || p === it.photos.detail_1;
const imgPool = it => lastImages(it).concat(it.realPhotos || [], it.photos.detail_1 ? [it.photos.detail_1] : []);
const defaultImgs = it => lastImages(it).filter(p => ((it.grades || {})[p] || {}).grade !== 'C').concat(it.realPhotos || []);
const allReal = imgs => imgs.length && imgs.every(p => D.items.some(i => i.photos && isReal(i, p)));
function upcomingNodes() {
  const now = new Date(); now.setHours(0, 0, 0, 0);
  const out = [];
  for (const y of [now.getFullYear(), now.getFullYear() + 1]) for (const n of F().nodes) {
    const [m, d] = n.md.split('-').map(Number); const at = new Date(y, m - 1, d).getTime();
    const days = Math.round((at - now.getTime()) / 864e5);
    if (days >= 0 && days <= 60) out.push({...n, at, days, postBy: at - 14 * 864e5});
  }
  return out.sort((a, b) => a.at - b.at);
}
const weekStart = off => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (d.getDay() + 6) % 7 + off * 7); return d.getTime(); };
// 一款多号：每批图记着是给哪个号出的，只看这个号的（老数据没标号的大家都能用）
const myJobs = it => (it.lockJobs || []).filter(j => !j.account || String(j.account) === String(UI.acc));
const lastImages = it => (myJobs(it).find(j => j.images.length) || {images: []}).images;
const busyHint = text => `<div class="hint"><span class="dot" style="display:inline-block"></span> ${text}</div>`;

// ---------- 结构：四大块，每块一排子页；每页页头一句话告诉人这一页干什么
const DESC = {
  'img.info': '拍好的衣服照片放进来，AI 读吊牌写档案；你补上材质手感和痛点，再核对检查要点。',
  'img.shoot': '选风格和参考图，锁住衣服细节出图。每个号记得自己上次的拍法，换号自动换。每张出完 AI 会放大检查，不合格自动重做。',
  'img.result': '挑能用的图（AI 图和实拍图可以混着用），第 1 张是封面，然后交给 AI 写文案。',
  'img.lib': '模特照片和想模仿的参考图。参考图按风格分组，可以自己加组；出图时选了风格就自动带上。',
  'copy.topic': '每个号一个选题库。看场景 × 身材哪里还空着，挑一条去写。',
  'copy.review': '挑标题、改字。没问题就定稿，交给「发布」。',
  'copy.write': '从「选题库」点「写这条」或从「出好的图」点「写文案」进来。写好进「审稿」，不会自动发。',
  'copy.set': '账号定位、口吻和封面样式设一次，之后每篇都按这个写。',
  'pub.queue': '调封面和图序，选时间。到点工作台打开浏览器直接发。',
  'pub.cal': '这一周排了什么、发了什么、哪篇没发出去。切到「全部号」看整个矩阵哪天谁发什么、有没有撞款。',
  'pub.login': '每个号在工作台扫一次码，之后一直有效。',
  'hist.all': '发过什么、哪里出错、AI 做了什么，都按时间排在这里。',
  'hist.pub': '已经发出去的笔记。', 'hist.fail': '没发出去的和被驳回的，处理完就从这里消失。', 'hist.ai': '交给 AI 的每件事：出选题、写档案、出图、写文案、改稿。',
};
const TABS = [
  ['img', '第 1 块', '产品图'], ['copy', '第 2 块', '文案'], ['pub', '第 3 块', '发布'], ['hist', '第 4 块', '历史记录']];
function subsOf(tab) {
  const R = mine(D.reviews);
  const nTodo = R.filter(r => ['todo', 'rejected'].includes(draftState(r))).length, nReady = R.filter(r => draftState(r) === 'ready').length;
  return {
    img: [['info', '照片和资料'], ['shoot', '出图'], ['result', '出好的图'], ['lib', '模特和参考图库']],
    copy: [['topic', `选题库（${unusedTopics().length}）`], ['review', `审稿（${nTodo}）`]].concat(UI.sub.copy === 'write' ? [['write', '写稿']] : [], [['set', '文案设定']]),
    pub: [['queue', `待发布（${nReady}）`], ['cal', '排期日历'], ['login', '账号登录']],
    hist: [['all', '全部'], ['pub', '已发布'], ['fail', '没发出 / 驳回'], ['ai', 'AI 任务']],
  }[tab];
}
function go(tab, sub) { UI.tab = tab; if (sub) UI.sub[tab] = sub; save(); render(); window.scrollTo(0, 0); }

function render() {
  const sel = $('#acc');
  sel.innerHTML = D.accounts.map(a => `<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('') || '<option value="">没有账号</option>';
  sel.value = UI.acc;
  const a = acc();
  $('#online').className = 'login' + (a && a.online ? ' on' : '');
  $('#online').innerHTML = a ? `<i></i>${a.online ? '小红书已登录' : '小红书未登录，点这里扫码'}` : '';
  const run = activeJobs(), cur = run.find(j => j.status === 'running');
  const lastFail = D.jobs.find(j => j.status === 'failed' && Date.now() - (j.endedAt || 0) < 6 * 3600e3);
  $('#aiBtn').innerHTML = run.length ? `<span class="dot"></span><span>${esc(cur ? cur.title : '排队中')}${run.length > 1 ? ` 等 ${run.length} 件` : ''}</span>` : lastFail ? '<span class="pill bad">有任务失败</span><span>点开看</span>' : '<span class="muted">AI 空闲 · 看任务记录</span>';
  const st = D.stats[String(UI.acc)] || {}, R = mine(D.reviews);
  // 侧栏每块右边一个数：要人处理的才标红
  const nTodo = R.filter(r => draftState(r) === 'todo').length, nReady = R.filter(r => draftState(r) === 'ready').length;
  const counts = {img: [myItems().some(i => i.busy) ? '…' : myItems().length || '', false], copy: [nTodo || '', nTodo > 0],
    pub: [nReady || st.scheduled || '', nReady > 0], hist: [st.failed || '', st.failed > 0]};
  const subs = subsOf(UI.tab);
  if (!subs.some(s => s[0] === UI.sub[UI.tab])) UI.sub[UI.tab] = subs[0][0];
  const subBtns = subs.map(([k, l]) => { const m = l.match(/^(.*?)（(\d+)）$/); return `<button type="button" data-tab="${UI.tab}" data-sub="${k}" aria-selected="${UI.sub[UI.tab] === k}"><span>${esc(m ? m[1] : l)}</span>${m && m[2] !== '0' ? `<span class="num">${m[2]}</span>` : ''}</button>`; }).join('');
  $('#big').innerHTML = TABS.map(([k, no, name], i) => `<button type="button" class="sec-b" data-tab="${k}" aria-selected="${UI.tab === k}"><span class="n">${i + 1}</span><b>${name}</b><span class="c ${counts[k][1] ? 'hot' : ''}">${esc(counts[k][0])}</span></button>${UI.tab === k ? `<div class="subs">${subBtns}</div>` : ''}`).join('');
  $('#subm').innerHTML = subBtns;
  const subName = (subs.find(s => s[0] === UI.sub[UI.tab]) || ['', ''])[1].replace(/（\d+）$/, '');
  $('#crumb').textContent = `第 ${TABS.findIndex(t => t[0] === UI.tab) + 1} 块 · ${TABS.find(t => t[0] === UI.tab)[2]}`;
  $('#ptitle').textContent = subName;
  $('#pdesc').textContent = DESC[UI.tab + '.' + UI.sub[UI.tab]] || '';
  const h = [];
  if (D.demo) h.push('<div class="notice demo"><b>演示模式</b>：数据是假的，不会调用 Codex，也不会真的发帖。</div>');
  if (!D.lock.ok) h.push(`<div class="notice bad"><b>找不到锁图工作台</b>（${esc(D.lock.path)}）。出图用不了，到“设置 › 高级”里填 xhs-lock-studio 文件夹的位置。</div>`);
  if (!D.publisherOk) h.push('<div class="notice bad"><b>找不到发布脚本</b>（xhs-autopilot/publisher/xhs_publish.py）。发布用不了。</div>');

// 矩阵日历：一行一个号、一列一天；同一款两个号隔不到 2 天标红；右边是这周排了几篇 / 最多几篇
function calMatrix() {
  const ws = weekStart(UI.week), today = new Date(); today.setHours(0, 0, 0, 0);
  const wk = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
  const S = D.schedule.filter(s => s.status !== 'cancelled');
  const dayN = t => { const d = new Date(t); return Math.round(new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime() / 864e5); };
  const itemOf = s => (D.reviews.find(x => String(x.id) === String(s.review)) || {}).item || '';
  const clash = s => { const it = itemOf(s); return it && S.some(o => o !== s && String(o.account) !== String(s.account) && itemOf(o) === it && Math.abs(dayN(o.at) - dayN(s.at)) < 2); };
  const rows = D.accounts.map(a => {
    const mine = S.filter(s => String(s.account) === String(a.id) && s.at >= ws && s.at < ws + 7 * 864e5);
    const rh = a.rhythm || {}, n = mine.filter(s => s.status !== 'failed' && s.status !== 'missed').length;
    const cells = wk.map((w, i) => { const d0 = ws + i * 864e5; return `<td>${mine.filter(s => s.at >= d0 && s.at < d0 + 864e5).sort((x, y) => x.at - y.at).map(s => { const t = new Date(s.at); return `<button type="button" class="cal ${s.status} ${clash(s) ? 'clash' : ''}" data-do="slot" data-id="${esc(s.id)}" title="${esc(s.title)}${clash(s) ? '（同一款和别的号隔不到 2 天）' : ''}"><span class="t">${pad(t.getHours())}:${pad(t.getMinutes())}</span> ${esc(itemName(itemOf(s)) || s.title)}</button>`; }).join('')}</td>`; }).join('');
    return `<tr><td class="acc"><b>${esc(a.name)}</b><br><span class="small muted">${rh.ramping ? `起号第 ${rh.week} 周 · ${esc(rh.stage)}` : a.persona && D.personas[a.persona] ? esc(D.personas[a.persona].name) : ''}</span></td>${cells}
      <td class="acc num ${rh.target && n < rh.target ? '' : 'muted'}">${n}${rh.target ? ' / ' + rh.target : ''} 篇</td></tr>`;
  }).join('');
  const nClash = S.filter(s => s.at >= ws && s.at < ws + 7 * 864e5 && clash(s)).length;
  return `<div style="overflow-x:auto"><table class="mx"><colgroup><col style="width:120px">${wk.map(() => '<col>').join('')}<col style="width:78px"></colgroup>
    <tr><th></th>${wk.map((w, i) => { const d0 = ws + i * 864e5; return `<th class="${d0 === today.getTime() ? 'today' : ''}">${w} ${new Date(d0).getDate()}</th>`; }).join('')}<th>本周</th></tr>${rows}</table></div>
    <div class="hint" style="margin-top:14px">${nClash ? `<b>有 ${nClash} 篇标红：</b>同一款在两个号隔不到 2 天，点开取消一篇再用「自动」时间重排。` : '这周没有撞款。'}自动时间会让不同号错开 30 分钟以上，同一款在不同号隔 2 天；起号的号按阶段限制每周篇数。</div>`;
}

      n ? `${fmtD(n.at)}「${esc(n.name)}」还有 ${n.days} 天，相关内容建议 ${fmtD(n.postBy)} 前开始发。` : ''].filter(Boolean).join(' ') || '这一周都排上了。'}</div>

      act: s.rescheduled ? '<span class="small muted">已重新排期</span>' : r ? `<button type="button" class="ghost" data-do="reschedule" data-id="${esc(s.id)}">重新排期</button> <button type="button" class="link" data-do="slot" data-id="${esc(s.id)}">看过程</button>` : '<span class="small muted">稿已删</span>'});
  }
  for (const r of mine(D.reviews).filter(r => r.status === '驳回')) rows.push({kind: 'fail', at: r.id, type: ['已驳回', 'bad'], title: r.title, note: checkDraft(r, false).errs.join('；'), act: `<button type="button" class="ghost" data-do="editRejected" data-id="${r.id}">改了再审</button>`, noTime: true});
  for (const j of D.jobs.filter(j => !j.params || !j.params.account || String(j.params.account) === String(UI.acc))) {

function readFile(file) { return new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(file); }); }

async function uploadRefs(files, style) {
  let n = 0;
  for (const f of files) { if (!/^image\//.test(f.type)) continue; const j = await api('/api/ref/upload', {name: f.name, data: await readFile(f), style}); if (j) { n++; if (PICK.style === style && !PICK.refs.includes(j.path)) PICK.refs.push(j.path); } }
  if (n) { toast(`已上传 ${n} 张参考图`); render(); }
}
function parsePasted(text) {
  // 认 GPT 常见格式：「标题：」「标题1：」、Markdown 粗体和井号、末尾一串 #话题
  const titles = [], tags = [], body = [];
  for (let line of String(text || '').replace(/\r/g, '').split('\n')) {
    line = line.replace(/\*\*/g, '').replace(/^\s{0,3}#{1,6}\s+/, '').trimEnd();
    const t = line.match(/^\s*(?:备选)?标题\s*\d*\s*[:：]\s*(.+)$/);
    if (t) { titles.push(t[1].replace(/^[「“"]|[」”"]$/g, '').trim()); continue; }
    const found = line.match(/#[^\s#\[]+/g);
    if (found && line.replace(/#[^\s#]+(\[话题\])?#?/g, '').replace(/^\s*(话题|标签)\s*[:：]/, '').trim() === '') { found.forEach(x => tags.push(x.slice(1))); continue; }
    if (/^\s*(正文|话题|标签)\s*[:：]\s*$/.test(line)) continue;
    body.push(line.replace(/^\s*正文\s*[:：]\s*/, '').replace(/^\s{0,3}[-*]\s+/, ''));
  }
  let b = body.join('\n').replace(/\n{3,}/g, '\n\n').trim();
  if (!titles.length) { const first = b.split('\n')[0]; if (first && len(first) <= 20 && b.includes('\n')) { titles.push(first.trim()); b = b.slice(first.length).trim(); } }
  return {titles: Array.from(new Set(titles)).slice(0, 5), tags: Array.from(new Set(tags)).slice(0, 10), body: b};
}

  if (n) toast(`已加 ${n} 张实拍图`);
};
$('#logoFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f || !/^image\//.test(f.type)) { render(); return; }
  if (await api('/api/account/cover', {id: UI.acc, cover: 'logo', logo: await readFile(f)})) toast('logo 已上传，之后这个号的图右下角都放它');
};
$('#photoFile').onchange = e => { if (e.target.files[0]) uploadPhoto(e.target.dataset.id, e.target.dataset.slot, e.target.files[0]); e.target.value = ''; };
document.addEventListener('change', e => {
  const t = e.target;
  if (t.name === 'face') { PICK.face = t.value; render(); }
  if (t.name === 'split') W.split = Number(t.value);
  if (t.id === 'wCover') W.cover = t.value;
  if (t.name === 'cover') {
    if (t.value === 'logo' && !(acc() || {}).logo) { $('#logoFile').click(); render(); }
    else api('/api/account/cover', {id: UI.acc, cover: t.value}).then(j => j && toast('封面样式已改'));
  }
  if (t.id === 'autoWrite') { PICK.autoWrite = t.checked; render(); }
  if (t.dataset.persona && t.value) {
    const id = t.dataset.persona, p = D.personas[t.value], a = D.accounts.find(x => String(x.id) === id) || {};
    dlgConfirm(`「${a.name}」套用「${p.name}」人设`, `会把这个号的文案设定（定位、口吻、每篇必写、话题配比）、封面样式和出图拍法换成「${p.name}」的，之后还能改。`, '套用',
      async () => { if (await api('/api/account/persona', {id, persona: t.value})) toast('已套用'); });
    $('#dlg').addEventListener('close', () => render(), {once: true});
  }
  if (t.dataset.fresh) api('/api/account/persona', {id: t.dataset.fresh, fresh: t.checked}).then(j => j && toast(t.checked ? '从今天起按起号节奏排' : '已改成稳定期'));
  if (t.id === 'autoSplit') PICK.split = t.checked ? 2 : 1;
  if (t.id === 'whenAt') UI.whenAt = t.value;
  if (t.id === 'markAi') UI.markAi = t.checked;
  if (t.id === 'wItem') { W.item = t.value; W.imgs = []; W.topic = null; t.blur(); render(); }
  if (t.id === 'wTopic') W.topic = t.value;
  if (t.id === 'trialItem') W.trialItem = t.value;
  if (t.dataset && t.dataset.refstyle) api('/api/ref/style', {path: t.dataset.refstyle, style: t.value}).then(j => j && toast('已移到「' + D.styles[t.value] + '」'));
});
document.addEventListener('toggle', async e => {
  if (e.target.id !== 'promptBox' || !e.target.open) return;
  let j = null;
  try { j = await (await fetch('/api/prompt/preview', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({account: UI.acc, item: W.trialItem})})).json(); } catch (err) {}
  const pre = $('#promptText'); if (pre) pre.textContent = j && j.prompt ? j.prompt : (j && j.error) || '读不到';
}, true);
document.addEventListener('click', async e => {
  const drop = e.target.closest('.drop[data-slot]');
  if (drop) { const fi = $('#photoFile'); fi.dataset.id = drop.dataset.id; fi.dataset.slot = drop.dataset.slot; fi.click(); return; }
  const b = e.target.closest('[data-do]'); if (!b || b.closest('dialog')) return;
  const id = b.dataset.id, r = D.reviews.find(x => String(x.id) === String(id)), it = D.items.find(i => i.id === id);
  switch (b.dataset.do) {
    case 'goSub': go(b.dataset.tab, b.dataset.sub); break;
    case 'goLogin': go('pub', 'login'); break;
    case 'goItem': UI.item = id; go('img', 'info'); break;
    // 产品图
    case 'addItem': dlgNew(); break;
    case 'editItem': dlgItem(it); break;
    case 'pickItem': UI.item = id; W.item = ''; save(); render(); break;
    case 'saveInfo': {
      const body = {status: it.status || '在售', topicAccount: UI.acc};
      ITEM_KEYS.forEach(k => body[k] = it[k] || ''); body.id = it.id;
      ['texture', 'pain', 'modelSize', 'price', 'goods'].forEach(k => body[k] = $('#if-' + k).value.trim());
      document.activeElement.blur();
      const j = await api('/api/item/save', body);
      if (j) toast(j.topicJob ? '已保存。材质和痛点填好了，AI 开始给这款出 5 条选题' : '已保存');
      break; }
    case 'spec': { const j = await api('/api/job', {kind: 'spec', params: {item: id}}); if (j) toast('已交给 AI 写档案，大约 3–5 分钟'); break; }
    case 'addCheck': { const box = $('#checks'); box.insertAdjacentHTML('beforeend', chkRow({level: '必过', text: ''}, box.children.length, true)); box.lastElementChild.querySelector('input:not([type=checkbox])').focus(); break; }
    case 'delCheck': b.closest('.chk').remove(); break;
    case 'viewSpec': openDlg(`<h2>完整档案</h2><pre class="log">${esc(it.specText || '')}</pre><p class="small muted" style="margin:0">要改大段内容，直接编辑 ${esc(it.dir)}/spec.md。</p>` + closeBtn, () => {}); break;
    case 'confirmSpec': {
      const cs = readChecks();
      if (!cs.some(c => c.level === '必过')) { toast('至少留一条「必过」'); break; }
      const unsure = cs.filter(c => !c.ok).length;
      if (unsure) { $('#chkLeft').textContent = `还有 ${unsure} 条黄色的没对着实物看`; toast(`还有 ${unsure} 条黄色的没核对`); break; }
      if (await api('/api/item/checks', {id, checks: cs.map(({level, text}) => ({level, text})), confirmed: true})) go('img', 'shoot');
      break; }
    case 'addReal': { const fi = $('#realFile'); fi.dataset.id = id; fi.click(); break; }
    case 'delReal': dlgConfirm('移除这张实拍图？', '图会挪到这款原图目录的 real/_removed 文件夹。', '移除', () => api('/api/item/real', {id, action: 'delete', path: b.dataset.p})); break;
    case 'newGroup': dlgGroup(); break;
    case 'editGroup': dlgGroup((D.styleGroups || []).find(g => g.id === b.dataset.k)); break;
    case 'delGroup': dlgConfirm(`删掉「${D.styles[b.dataset.k]}」这一组？`, '组里的参考图不会删，会回到「其他」。', '删掉', () => api('/api/style/group', {action: 'delete', id: b.dataset.k})); break;
    case 'pickLogo': $('#logoFile').click(); break;
    case 'style': { const cur = D.items.find(i => i.id === UI.item); if (cur) initPick(cur, b.dataset.k); render(); break; }
    case 'pickModel': PICK.model = b.dataset.name; render(); break;
    case 'pickRef': { const i = PICK.refs.indexOf(b.dataset.ref); if (i >= 0) PICK.refs.splice(i, 1); else PICK.refs.push(b.dataset.ref); render(); break; }
    case 'uploadRef': { const fi = $('#refFile'); fi.dataset.style = b.dataset.style; fi.click(); break; }
    case 'delRef': dlgConfirm('从参考图库移除？', '图会挪到 references/_removed 文件夹，要找回去那里拿。', '移除', () => api('/api/ref/delete', {path: b.dataset.ref})); break;
    case 'lock': {
      const params = {item: id, account: UI.acc, face: PICK.face, model: PICK.model, refs: PICK.refs, style: PICK.style, note: ($('#lockNote') || {}).value || ''};
      if (PICK.autoWrite && UI.acc) params.autoWrite = {account: UI.acc, count: PICK.split};
      const j = await api('/api/job', {kind: 'lock', params});
      if (j) toast(`已开始出图，约 ${j.job.estimateMin} 分钟${params.autoWrite ? '，出完自动写文案' : ''}`);
      break; }
    case 'dropClash': { const used = ((r.clash || {}).images || []).map(u => u.img); if (await api('/api/review', {account: UI.acc, id, action: 'images', images: (r.images || []).filter(p => !used.includes(p))})) toast('已去掉，可以定稿了'); break; }
    case 'calMode': UI.calAll = b.dataset.k === 'all'; save(); render(); break;
    case 'multiShoot': { const cur = D.items.find(i => i.id === id); if (cur) dlgMulti(cur); break; }
    case 'report': { const lj = myJobs(it)[0]; openDlg(`<h2>出图报告</h2><p class="small muted" style="margin:0">${esc(lj ? lj.dir : '')}</p><pre class="log">${esc(lj && lj.report ? lj.report : '还没有报告')}</pre>` + closeBtn, () => {}); break; }
    case 'pickImg': { const p = b.dataset.p, i = W.imgs.indexOf(p); if (i >= 0) W.imgs.splice(i, 1); else W.imgs.push(p); render(); break; }
    case 'toWrite': W.topic = null; go('copy', 'write'); break;
    // 文案
    case 'genTopics': { const j = await api('/api/job', {kind: 'topics', params: {account: UI.acc, count: 10, node: ($('#tpNode') || {}).value || ''}}); if (j) toast('AI 开始联网找痛点出选题，大约 3–5 分钟'); break; }
    case 'addTopic': {
      const text = $('#tpText').value.trim(); if (!text) { $('#tpText').focus(); break; }
      document.activeElement.blur();
      if (await api('/api/topic', {action: 'add', account: UI.acc, text, scene: $('#tpScene').value, body: $('#tpBody').value})) toast('已加入选题库');
      break; }
    case 'delTopic': dlgConfirm('删掉这条选题？', (D.topics.find(t => t.id === id) || {}).text || '', '删掉', () => api('/api/topic', {action: 'delete', id})); break;
    case 'unuseTopic': api('/api/topic', {action: 'unuse', id}); break;
    case 'useTopic': {
      const t = D.topics.find(x => x.id === id);
      if (t.item && myItems().some(i => i.id === t.item && lastImages(i).length)) { if (W.item !== t.item) W.imgs = []; W.item = t.item; }
      W.topic = id; go('copy', 'write'); break; }
    case 'pickReview': UI.review = id; go('copy', 'review'); break;
    case 'saveDraft': {
      const x = readEdits(r); document.activeElement.blur();
      if (!Object.keys(x.edits).length && r.status !== '驳回') { toast('没有改动'); break; }
      if (await api('/api/review', {account: UI.acc, id, action: 'save', title: x.title, body: x.body, tags: x.tags, comment: x.comment})) toast('已保存');
      break; }
    case 'finalize': {
      const x = readEdits(r), c = checkDraft({...r, title: x.title, body: x.body, tags: x.tags, comment: x.comment});
      if (!c.ok) { toast('先改掉：' + c.errs.join('；')); break; }
      document.activeElement.blur();
      if (Object.keys(x.edits).length && !(await api('/api/review', {account: UI.acc, id, action: 'save', ...x.edits}))) break;
      if (!(await api('/api/review', {account: UI.acc, id, action: 'ready'}))) break;
      UI.pubSel = String(id); go('pub', 'queue'); toast('文案定稿了，调好封面和时间就能排期');
      break; }
    case 'reject': dlgConfirm('驳回这篇？', r.title, '驳回', () => api('/api/review', {account: UI.acc, id, action: 'reject'})); break;
    case 'delDraft': dlgConfirm('删除这篇稿？', `「${r.title}」删除后找不回来。`, '删除', () => api('/api/review', {account: UI.acc, id, action: 'delete'})); break;
    case 'rewrite': {
      const note = ($('#rwNote') || {}).value.trim();
      if (!note) { $('#rwNote').focus(); toast('先写一句怎么改'); break; }
      document.activeElement.blur();
      if (await api('/api/review', {account: UI.acc, id, action: 'rewrite', note})) toast('已交给 AI 改，改好这里会自动更新');
      break; }
    case 'copyComment': {
      const t = (D.reviews.find(x => String(x.id) === String(id)) || {}).comment || '';
      try { await navigator.clipboard.writeText(t); toast('已复制置顶评论'); } catch (e) { toast('复制不了，手动选中复制吧'); }
      break; }
    case 'quickRw':
      if (await api('/api/review', {account: UI.acc, id, action: 'rewrite', note: b.dataset.note})) toast(`已交给 AI「${b.textContent}」，改好这里会自动更新`);
      break;
    case 'paste': openDlg(`<h2>粘贴 GPT 写的文案</h2><p class="small muted" style="margin:0">把 ChatGPT 或 Codex 里写好的整段贴进来，会自动拆成标题、正文和话题，填进当前这篇；保存前还能再改。</p><label class="f">文案<textarea id="pasteText" rows="10" required></textarea></label>` + btns('拆开填进去'),
      async f => {
        const x = parsePasted(f.querySelector('#pasteText').value);
        if (!x.body) { toast('没认出正文'); return false; }
        $('#rBody').value = x.body; $('#bodyCount').textContent = `${len(x.body)} / 888`;
        if (x.tags.length) $('#rTags').value = x.tags.join(' ');
        if (x.titles.length) {
          const box = document.querySelector('.titles');
          x.titles.forEach(t => box.insertAdjacentHTML('beforeend', `<label><input type="radio" name="title" value="${esc(t)}"> ${esc(t)} <span class="small muted" style="margin-left:auto">${len(t)} 字 · 粘贴的</span></label>`));
          box.querySelector(`input[value="${CSS.escape(x.titles[0])}"]`).checked = true;
        }
        toast('已填进去，看一眼没问题点「保存」或「文案定稿」');
      }); break;
    case 'write': {
      if (!UI.acc) { toast('先选账号'); break; }
      const j = await api('/api/job', {kind: 'write', params: {account: UI.acc, item: id, images: W.imgs, count: W.split, cover: W.cover || (acc() || {}).cover || 'text', topic: W.topic || '', note: ($('#writeNote') || {}).value || '', ref: ($('#writeRef') || {}).value || ''}});
      if (j) { W.topic = null; toast('已交给 AI 写，写好会出现在「审稿」'); }
      break; }
    case 'saveCopy': {
      const body = {id: UI.acc}; ['position', 'tone', 'must', 'banned', 'tagMix'].forEach(k => body[k] = $('#cs-' + k).value.trim());
      document.activeElement.blur();
      if (await api('/api/account/copy', body)) toast('已保存，之后写的文案都按这个来');
      break; }
    case 'preset': {
      const pv = (D.copyPresets || {})[b.dataset.k]; if (!pv) break;
      const doIt = async () => { if (await api('/api/account/copy', {id: UI.acc, ...pv})) toast(`已套用「${b.dataset.k}」的设定，可以接着改`); };
      const a = acc() || {};
      if (['position', 'tone', 'must', 'tagMix'].some(k => a[k])) dlgConfirm(`套用「${b.dataset.k}」的预设？`, '会覆盖现在的定位、口吻、每篇必写和话题配比。', '套用', doIt); else doIt();
      break; }
    case 'trial': { const j = await api('/api/job', {kind: 'trial', params: {account: UI.acc, item: W.trialItem}}); if (j) toast('开始试写，大约 1–2 分钟'); break; }
    // 发布
    case 'pickPub': UI.pubSel = id; render(); break;
    case 'img': {
      const L = (r.images || []).slice(), i = Number(b.dataset.i), op = b.dataset.op;
      if (op === 'cover') L.unshift(L.splice(i, 1)[0]);
      else if (op === 'left') [L[i - 1], L[i]] = [L[i], L[i - 1]];
      else if (op === 'right') [L[i + 1], L[i]] = [L[i], L[i + 1]];
      else L.splice(i, 1);
      // 调图会让稿子回到待审（防止排期后内容变了），调完直接重新定稿
      if (await api('/api/review', {account: UI.acc, id, action: 'images', images: L})) await api('/api/review', {account: UI.acc, id, action: 'ready'});
      break; }
    case 'when': UI.when = b.dataset.k; render(); break;
    case 'approve': approveFlow(r); break;
    case 'tryFill': {
      toast('正在打开发布页试填，大约 1 分钟…');
      const j = await api('/api/publish/try', {account: UI.acc, id, markAi: UI.markAi});
      if (!j) break;
      const plain = (j.tags || {}).plain || [];
      openDlg(`<h2>试填好了，没有发出去</h2>${j.shot ? `<a href="${img(j.shot)}" target="_blank" rel="noopener"><img src="${img(j.shot)}" alt="发布页截图" style="width:100%;border-radius:8px;border:1px solid var(--line)"></a>` : '<p class="small muted">演示模式没有截图。</p>'}
        ${plain.length ? `<div class="notice">这些话题平台上没有完全一样的，会按普通文字留着：${plain.map(esc).join('、')}</div>` : ''}<p class="small muted" style="margin:0">没问题的话回到这篇，点「确认排期」。</p>` + closeBtn, () => {});
      break; }
    case 'backToCopy': if (await api('/api/review', {account: UI.acc, id, action: 'unready'})) { UI.review = String(id); go('copy', 'review'); } break;
    case 'package': api('/api/package', {account: UI.acc, id}).then(j => j && toast(`发布包已生成（${j.images} 张图），已在访达打开`)); break;
    case 'unsched': dlgConfirm('取消这次排期？', '取消后稿子还在「待发布」里，可以重新排。', '取消排期', () => api('/api/unschedule', {id})); break;
    case 'slot': dlgSlot(D.schedule.find(s => s.id === id)); break;
    case 'wk': UI.week = Number(b.dataset.d) === 0 ? 0 : UI.week + Number(b.dataset.d); render(); break;
    case 'login': login(id); break;
    case 'checkLogin': { const j = await api('/api/xhs/check', {account: id || UI.acc}); if (j) toast(j.loggedIn ? '登录好了' : '还没登录上，再扫一次试试'); break; }
    case 'renameAcc': { const v = document.querySelector(`[data-accname="${CSS.escape(id)}"]`).value.trim(); document.activeElement.blur(); if (v && await api('/api/account', {id, name: v})) toast('已改名'); break; }
    case 'addAcc': { const v = $('#newAcc').value.trim(); if (!v) { $('#newAcc').focus(); break; } document.activeElement.blur(); const j = await api('/api/account', {name: v, persona: $('#newPersona').value, fresh: $('#newFresh').checked}); if (j) { UI.acc = String(j.account.id); save(); render(); toast(j.account.persona ? '加好了，拍法、封面、文案口吻已按人设填好；点「扫码登录」登上这个号' : '加好了，点「扫码登录」登上这个号'); } break; }
    // 历史
    case 'reschedule': reschedule(id); break;
    case 'editRejected': UI.review = String(id); go('copy', 'review'); break;
    case 'log': dlgLog(id); break;
    case 'cancelJob': api('/api/job/cancel', {id}); break;
  }
});
refresh(true);
setInterval(() => { if (!$('#dlg').open) refresh(false); }, 4000);
})();
</script>
</body>
</html>
